services:
  db:
    image: postgres:16-alpine
    container_name: raxa-db
    environment:
      POSTGRES_DB: raxa
      POSTGRES_USER: raxa
      POSTGRES_PASSWORD: raxa
    ports:
      - "5432:5432"
    volumes:
      - raxa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raxa"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: raxa-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/raxa
      DB_USER: raxa
      DB_PASSWORD: raxa
      JWT_SECRET: ${JWT_SECRET:-mudar-em-producao-segredo-longo-e-aleatorio}
    restart: on-failure

volumes:
  raxa_data:
