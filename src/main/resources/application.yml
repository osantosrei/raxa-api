spring:
  application:
    name: raxa-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raxa}
    username: ${DB_USER:raxa}
    password: ${DB_PASSWORD:raxa}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    init-sqls:
      - CREATE EXTENSION IF NOT EXISTS pgcrypto

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:mudar-em-producao-segredo-longo-e-aleatorio}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173,https://raxa-web.vercel.app,https://*.vercel.app}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.raxa: DEBUG
    org.springframework.security: INFO
