spring:
  application:
    name: raxa-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raxa}
    username: ${DB_USER:raxa}
    password: ${DB_PASSWORD:raxa}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mudar-em-producao-segredo-longo-e-aleatorio}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.raxa: DEBUG
    org.springframework.security: INFO
