spring:
  application:
    name: raxa

  datasource:
    url: jdbc:postgresql://localhost:5432/raxa
    username: raxa_user
    password: raxa_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: sua-chave-secreta-muito-longa-para-ser-segura-aqui-123456
  expiration: 86400000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
